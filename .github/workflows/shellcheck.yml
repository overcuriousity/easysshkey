name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint
        run: shellcheck -S style sshkeymanager.sh install.sh

      - name: Syntax check
        run: bash -n sshkeymanager.sh && bash -n install.sh

      - name: Installer smoke test
        run: |
          INSTALL_DIR="$RUNNER_TEMP/bin" REF="$GITHUB_SHA" bash install.sh
          "$RUNNER_TEMP/bin/sshkeymanager" --help
          INSTALL_DIR="$RUNNER_TEMP/bin" bash install.sh --uninstall

      - name: Menu exits cleanly on EOF
        run: timeout 30 bash sshkeymanager.sh --dry-run < /dev/null
